<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gerald Wants Up</title>
<meta name="description" content="A weird idle game about a beanstalk with a grievance.">
<meta name="theme-color" content="#1d0f2b">
<link rel="stylesheet" href="css/steam.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hudLeft" class="card">
        <div id="hudMoney" class="money">$0</div>
        <div class="sub"><span id="hudIps">$0</span>/sec</div>
        <div class="chips">
          <span id="hudSocks" class="chip" title="Socks: catch them, spend them on automation">🧦 <b id="hudSockN">0</b></span>
          <span id="hudMulch" class="chip" title="Mulch: from composting, spend on permanent perks">🪱 <b id="hudMulchN">0</b></span>
        </div>
        <div id="hudBuffs"></div>
      </div>
      <button id="objective" class="card" title="Your goal">
        <div class="objTop"><span class="objIcon">🎯</span><span id="objText">Gerald wants up.</span></div>
        <div class="bar"><i id="objBar"></i></div>
        <div id="objSub" class="sub"></div>
      </button>
      <div id="hudRight">
        <button id="btnUp" class="round" title="Follow Gerald">⬆</button>
        <button id="btnDown" class="round" title="Scroll to the ground">⬇</button>
        <button id="btnMute" class="round" title="Sound on/off">🔊</button>
      </div>
      <div id="altMeter" title="Altitude"><div id="altTrack"></div></div>
      <div id="ticker"><b>SKY NEWS</b><span id="tickerText"></span></div>
    </div>
    <div id="plantMenu" class="pop hidden"></div>
    <div id="tutor" class="hidden">
      <canvas id="tutFace" width="96" height="96"></canvas>
      <div class="tutBody"><b>Wormsley</b><p id="tutText"></p><div id="tutBtns"></div></div>
    </div>
    <div id="tutArrow" class="hidden"></div>
  </main>
  <aside id="panel">
    <nav id="tabs">
      <button data-tab="grow" class="on">🌱<span>Garden</span></button>
      <button data-tab="quests" id="tabQuests">📜<span>Quests</span><em id="qBadge"></em></button>
      <button data-tab="compost" id="tabCompost">🪱<span>Compost</span><em id="cBadge"></em></button>
      <button data-tab="stuff">🎒<span>Stuff</span></button>
      <button data-tab="settings">⚙️<span>Settings</span></button>
    </nav>
    <section class="tab on" id="tab-grow"></section>
    <section class="tab" id="tab-quests"></section>
    <section class="tab" id="tab-compost"></section>
    <section class="tab" id="tab-stuff"></section>
    <section class="tab" id="tab-settings"></section>
    <div id="sheetGrab" style="display:none"><button id="sheetClose" title="Open / close">▴</button></div>
  </aside>
</div>
<div id="toasts"></div>
<div id="modal" class="hidden"><div class="box"><div id="modalBody"></div></div></div>
<div id="title">
  <canvas id="titleCanvas"></canvas>
  <div class="titleUi">
    <h1 class="logo"><span>Gerald</span> <span>Wants</span> <span>Up</span></h1>
    <p class="tag">a game about a beanstalk with a grievance</p>
    <button id="btnPlay" class="big">Play</button>
    <p class="fine" id="titleFine"></p>
  </div>
</div>
<script src="js/econ.js"></script>
<script src="js/data.js"></script>
<script src="js/ink.js"></script>
<script src="js/util.js"></script>
<script src="js/zones.js"></script>
<script src="js/audio.js"></script>
<script src="js/draw.js"></script>
<script src="js/icons.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/quests.js"></script>
<script src="js/game.js"></script>
<script src="js/cutscene.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ui.js"></script>
<script src="js/steam.js"></script>
<script src="js/main.js"></script>
</body>
</html>
