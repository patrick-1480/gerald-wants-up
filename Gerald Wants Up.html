<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gerald Wants Up</title>
<meta name="description" content="A weird idle game about a beanstalk with a grievance.">
<meta name="theme-color" content="#1d0f2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gerald">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Gerald Wants Up — UI styles. Hand-drawn look: chunky ink borders, wobbly radii, drop shadows. */
:root {
  --ink: #1d0f2b; --pn: #3a1f55; --pn2: #2a1445; --pn3: #4a2a6c; --cream: #fff3dc; --dim: #cdb8ee;
  --or: #ff9a3c; --lil: #c58bff; --moss: #7be07b; --gold: #ffd23f; --pink: #ff7eb6; --sky: #6ad1ff; --red: #ff5a5a;
  --wob: 255px 18px 225px 18px / 18px 225px 18px 255px;
  --wob2: 18px 225px 18px 255px / 255px 18px 225px 18px;
  --display: "Chewy", "Comic Sans MS", "Chalkboard SE", cursive;
  --hand: "Gaegu", "Comic Sans MS", "Chalkboard SE", cursive;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  touch-action: manipulation;
  background: radial-gradient(ellipse at 50% -10%, #5a2d8a, var(--ink) 70%) fixed var(--ink);
  color: var(--cream); font: 700 18px/1.2 var(--hand); overflow: hidden;
  padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  -webkit-tap-highlight-color: transparent; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

#app { display: grid; grid-template-columns: 1fr 400px; gap: 12px; padding: 12px; height: 100%; }
#stage { container-type: size; container-name: stage; position: relative; border: 4px solid var(--ink); border-radius: 26px; overflow: hidden; box-shadow: 0 7px 0 var(--ink); min-height: 0; background: #7cc8ff; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
#panel { background: var(--pn); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 7px 0 var(--ink); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
.card { background: rgba(29, 15, 43, 0.82); border: 3px solid var(--ink); border-radius: var(--wob); box-shadow: 0 4px 0 var(--ink); padding: 8px 14px; color: var(--cream); }
#hudLeft { position: absolute; top: 10px; left: 10px; min-width: 170px; pointer-events: none; }
.money { font: 34px/1 var(--display); color: var(--gold); text-shadow: 0 3px 0 var(--ink); transition: transform .12s; }
.money.bump, .chip.bump { transform: scale(1.12); }
.sub { color: var(--dim); font-size: 16px; }
.chips { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.chip { background: var(--pn2); border: 2px solid var(--ink); border-radius: 12px; padding: 1px 8px; font-size: 16px; transition: transform .12s; display: inline-block; }
#hudBuffs { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
.buff { font: 15px var(--display); color: var(--ink); background: var(--gold); border: 2px solid var(--ink); border-radius: 10px; padding: 1px 8px; animation: pul .8s infinite alternate; }
@keyframes pul { to { transform: scale(1.05) rotate(-1deg); } }
#objective { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(420px, 46%); text-align: left; cursor: pointer; }
#objective:hover { filter: brightness(1.15); }
.objTop { display: flex; gap: 8px; align-items: center; font: 18px/1.1 var(--display); color: var(--gold); letter-spacing: .3px; }
.objIcon { font-size: 20px; }
.bar { height: 12px; background: var(--pn2); border: 2px solid var(--ink); border-radius: 8px; margin: 6px 0 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, var(--moss) 0 10px, #5fcf5f 10px 20px); transition: width .3s; }
#hudRight { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
.round { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--ink); background: var(--lil); box-shadow: 0 3px 0 var(--ink); font-size: 18px; padding: 0; }
.round:active { transform: translateY(3px); box-shadow: none; }
#altMeter { position: absolute; right: 14px; top: 170px; bottom: 60px; width: 14px; background: rgba(29,15,43,.55); border: 2px solid var(--ink); border-radius: 8px; }
#altTrack { position: absolute; inset: 0; }
.altTick { position: absolute; right: 16px; transform: translateY(50%); font: 13px var(--display); color: var(--cream); white-space: nowrap; text-shadow: 0 2px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink); opacity: .85; cursor: pointer; }
.altTick::after { content: ""; position: absolute; right: -16px; top: 50%; width: 12px; height: 2px; background: var(--cream); }
.altTick.next { color: var(--gold); opacity: 1; }
.altTick.locked { opacity: .5; }
.altMe { position: absolute; left: -9px; width: 28px; height: 28px; transform: translateY(50%); font-size: 20px; line-height: 28px; text-align: center; transition: bottom .4s; filter: drop-shadow(0 2px 0 var(--ink)); }
#ticker { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 34px; background: rgba(29,15,43,.82); border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; white-space: nowrap; display: flex; align-items: center; pointer-events: none; }
#ticker b { font: 15px var(--display); color: var(--ink); background: var(--pink); padding: 0 10px; height: 100%; display: flex; align-items: center; flex: none; z-index: 1; border-right: 3px solid var(--ink); }
#tickerText { display: inline-block; padding-left: 100%; animation: tick 22s linear infinite; color: var(--moss); font-size: 18px; }
@keyframes tick { to { transform: translateX(-100%); } }

/* ---------- side panel ---------- */
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 8px 0; background: var(--pn2); border-bottom: 3px solid var(--ink); }
#tabs button { position: relative; background: var(--pn); border: 3px solid var(--ink); border-bottom: none; border-radius: 14px 14px 0 0; padding: 5px 2px 4px; font-size: 20px; line-height: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--dim); }
#tabs button span { font: 13px var(--display); letter-spacing: .3px; }
#tabs button.on { background: var(--pn3); color: var(--cream); transform: translateY(1px); }
#tabs em { position: absolute; top: -6px; right: -2px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--pink); color: var(--ink); border: 2px solid var(--ink); font: 13px/16px var(--display); font-style: normal; display: none; }
#tabs em.on { display: block; animation: pul .6s infinite alternate; }
.tab { display: none; padding: 12px; overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--lil) var(--pn2); }
.tab.on { display: block; }
h2 { font: 22px/1.1 var(--display); color: var(--lil); margin: 14px 0 6px; text-shadow: 0 2px 0 var(--ink); letter-spacing: .3px; }
h2:first-child { margin-top: 0; }
.dim { color: var(--dim); font-size: 16px; font-weight: 400; }
.btn { border: 3px solid var(--ink); border-radius: var(--wob2); background: var(--or); color: var(--ink); padding: 7px 12px; box-shadow: 0 4px 0 var(--ink); font: 17px/1.1 var(--display); letter-spacing: .3px; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.wide { width: 100%; margin: 6px 0; }
.btn.big { font-size: 22px; padding: 12px; }
.btn.green { background: var(--moss); } .btn.pink { background: var(--pink); } .btn.lil { background: var(--lil); } .btn.gold { background: var(--gold); }
.btn.ghost { background: var(--pn2); color: var(--cream); }
.btn.glow:not(:disabled) { animation: glow 1.1s infinite alternate; }
@keyframes glow { to { box-shadow: 0 4px 0 var(--ink), 0 0 18px 4px rgba(255, 210, 63, .7); } }
.row { display: flex; gap: 8px; align-items: center; background: var(--pn2); border: 3px solid var(--ink); border-radius: var(--wob); padding: 7px 9px; margin-bottom: 7px; }
.row .m { flex: 1; min-width: 0; }
.row b { display: block; font: 17px/1.1 var(--display); letter-spacing: .3px; }
.row .btn { min-width: 96px; font-size: 15px; padding: 6px 8px; }
.row.done { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
.qicon { width: 48px; height: 48px; flex: none; background: rgba(255, 243, 220, .08); border: 2px solid var(--ink); border-radius: 12px; }
.row.sp { background: linear-gradient(135deg, #4b2a1a, var(--pn2)); }
.lvtag { color: var(--gold); font-size: 14px; margin-left: 4px; }
.qbar { height: 9px; background: var(--ink); border-radius: 6px; margin-top: 4px; overflow: hidden; }
.qbar i { display: block; height: 100%; background: var(--moss); }
.objCard { background: linear-gradient(135deg, #5a2d8a, var(--pn2)); border: 3px solid var(--ink); border-radius: var(--wob2); padding: 10px 12px; margin-bottom: 10px; }
.objCard .big { font: 22px/1.1 var(--display); color: var(--gold); }
.stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 16px; }
.stats span:nth-child(odd) { color: var(--dim); font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 7px; }
.relic { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 28px; background: var(--pn2); border: 3px solid var(--ink); border-radius: 50%; position: relative; }
.relic.no { filter: grayscale(1) brightness(.35); }
.hatBtn { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--pn2); border: 3px solid var(--ink); border-radius: 14px; padding: 4px; font-size: 13px; font-weight: 700; color: var(--cream); }
.hatBtn canvas { width: 56px; height: 56px; }
.hatBtn.on { background: var(--moss); color: var(--ink); }
.hatBtn:disabled { opacity: .35; }
.toggle { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 17px; }
input[type=range] { width: 150px; accent-color: var(--or); }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--moss); }
textarea { width: 100%; height: 90px; background: var(--pn2); color: var(--cream); border: 3px solid var(--ink); border-radius: 12px; font: 13px monospace; }

/* ---------- plant menu ---------- */
.pop { position: absolute; z-index: 6; width: 240px; background: var(--pn); border: 3px solid var(--ink); border-radius: var(--wob); padding: 9px; box-shadow: 0 5px 0 var(--ink); font-size: 15px; }
.pop .hd { display: flex; justify-content: space-between; gap: 6px; align-items: flex-start; }
.pop .hd b { font: 17px/1.05 var(--display); color: var(--gold); letter-spacing: .3px; }
.pop .x { background: var(--pn2); border: 2px solid var(--ink); border-radius: 8px; padding: 0 7px; font-size: 15px; }
.pop .fact { color: var(--pink); font-size: 14px; font-weight: 400; margin: 2px 0 4px; }
.pop .mr { display: flex; gap: 5px; margin-top: 6px; }
.pop .mr .btn { flex: 1; font-size: 14px; padding: 6px 4px; }
.pop .mr .btn.sm { flex: 0 0 56px; }
.pop .sec { margin-top: 8px; font: 14px var(--display); color: var(--lil); letter-spacing: .3px; }

/* ---------- tutorial guide ---------- */
#tutor { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); z-index: 8; display: flex; gap: 10px; align-items: center; background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: var(--wob); padding: 10px 14px; box-shadow: 0 6px 0 var(--ink); animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } }
#tutFace { width: 80px; height: 80px; flex: none; }
.tutBody { flex: 1; }
.tutBody b { font: 18px var(--display); color: #a0425c; letter-spacing: .3px; }
.tutBody p { margin: 3px 0 6px; font-size: 19px; line-height: 1.15; }
#tutBtns { display: flex; gap: 6px; justify-content: flex-end; }
#tutBtns .btn { font-size: 15px; padding: 5px 12px; }
#tutArrow { position: absolute; z-index: 9; width: 0; height: 0; pointer-events: none; }
#tutArrow::before { content: "👇"; position: absolute; left: -22px; top: -58px; font-size: 40px; animation: bob .6s infinite alternate; filter: drop-shadow(0 3px 0 var(--ink)); }
#tutArrow.up::before { content: "👆"; top: 12px; }
#tutArrow.left::before { content: "👈"; left: 14px; top: -22px; animation-name: bobx; }
@keyframes bob { to { transform: translateY(10px); } }
@keyframes bobx { to { transform: translateX(10px); } }
.tutRing { outline: 4px dashed var(--gold) !important; outline-offset: 3px; animation: ring 0.8s infinite alternate; }
@keyframes ring { to { outline-color: var(--pink); } }

/* ---------- toasts & modal ---------- */
#toasts { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 6px; z-index: 40; pointer-events: none; width: min(520px, 92vw); align-items: center; }
.toast { background: var(--gold); color: var(--ink); border: 3px solid var(--ink); border-radius: var(--wob2); padding: 7px 14px; font-size: 17px; box-shadow: 0 4px 0 var(--ink); animation: tin .3s cubic-bezier(.3,1.6,.5,1); transition: opacity .4s, transform .4s; text-align: center; }
.toast.visitor { background: var(--lil); } .toast.quest, .toast.claim { background: var(--moss); } .toast.zone { background: var(--pink); } .toast.grow { background: var(--cream); }
.toast.out { opacity: 0; transform: translateY(10px); }
@keyframes tin { from { transform: translateY(20px) scale(.8); opacity: 0; } }
#modal { position: fixed; inset: 0; background: rgba(15, 5, 25, .7); z-index: 45; display: flex; align-items: center; justify-content: center; padding: 16px; }
#modal .box { background: var(--pn); border: 4px solid var(--ink); border-radius: var(--wob); box-shadow: 0 7px 0 var(--ink); padding: 18px; width: min(460px, 100%); max-height: 90vh; overflow: auto; animation: tin .3s; }
#modal h3 { font: 26px var(--display); color: var(--gold); margin: 0 0 8px; }

/* ---------- title screen ---------- */
#title { position: fixed; inset: 0; z-index: 60; background: radial-gradient(ellipse at 50% 120%, #3c7a3c 0, #1d3a5a 45%, #12062a 85%); display: flex; align-items: center; justify-content: center; }
#titleCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.titleUi { position: relative; text-align: center; padding: 16px; }
.logo { font: clamp(48px, 11vw, 112px)/0.95 var(--display); margin: 0; color: var(--or); text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(255,154,60,.35); -webkit-text-stroke: 3px var(--ink); }
.logo span { display: inline-block; animation: wig 2.4s ease-in-out infinite; }
.logo span:nth-child(2) { color: var(--moss); animation-delay: .3s; }
.logo span:nth-child(3) { color: var(--gold); animation-delay: .6s; transform-origin: bottom; }
@keyframes wig { 50% { transform: rotate(-4deg) translateY(-6px); } }
.tag { font-size: 22px; color: var(--dim); margin: 6px 0 22px; }
.fine { color: var(--dim); font-size: 15px; font-weight: 400; margin-top: 14px; }
#btnPlay { font: 34px var(--display); padding: 10px 46px; border: 4px solid var(--ink); border-radius: var(--wob2); background: var(--moss); color: var(--ink); box-shadow: 0 6px 0 var(--ink); animation: pul 1s infinite alternate; }
#btnPlay:active { transform: translateY(6px); box-shadow: none; }

/* ---------- tablets / small laptops: slimmer side panel ---------- */
@media (max-width: 1100px) and (min-width: 761px) {
  #app { grid-template-columns: 1fr 330px; gap: 8px; padding: 8px; }
  #tabs button span { font-size: 11px; }
}
/* phones in landscape: short screen, keep the side panel but squeeze everything */
@media (max-height: 520px) and (min-width: 761px) {
  #app { grid-template-columns: 1fr 300px; padding: 6px; gap: 6px; }
  #stage, #panel { border-radius: 16px; border-width: 3px; box-shadow: 0 4px 0 var(--ink); }
  #ticker { display: none; }
  .money { font-size: 24px; }
  #tabs button { font-size: 16px; padding: 3px 2px; }
  #tabs button span { display: none; }
}
/* ---------- phones (portrait): full-screen game + bottom tab bar + slide-up sheet ---------- */
@media (max-width: 760px) {
  :root { --navH: calc(84px + env(safe-area-inset-bottom, 0px)); }
  body { padding: 0; font-size: 17px; }
  #app { display: block; padding: 0; height: 100dvh; }
  #stage { position: fixed; left: 0; right: 0; top: 0; bottom: var(--navH); border: none; border-radius: 0; box-shadow: none; padding-top: env(safe-area-inset-top, 0px); }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: min(64dvh, 560px); border-radius: 22px 22px 0 0; border-width: 3px 0 0; box-shadow: 0 -4px 0 var(--ink);
    display: flex; flex-direction: column; transform: translateY(calc(100% - var(--navH))); transition: transform .28s cubic-bezier(.3,1.2,.5,1); }
  #panel.open { transform: none; }
  #tabs { flex: none; height: 58px; padding: 6px 6px 0; border-bottom: 3px solid var(--ink); align-items: center; }
  #panel:not(.open) #tabs { padding-bottom: env(safe-area-inset-bottom, 0px); }
  #tabs button { border-radius: 14px; border-bottom: 3px solid var(--ink); padding: 4px 2px; height: 46px; justify-content: center; }
  #tabs button.on { transform: none; }
  #panel:not(.open) #tabs button.on { background: var(--pn); color: var(--dim); }
  #tabs button span { font-size: 11px; }
  #sheetGrab { display: block !important; order: -1; height: 26px; }
  .tab { padding: 10px 10px 14px; }
  #hudLeft { top: 8px; left: 8px; min-width: 0; padding: 5px 10px; }
  .money { font-size: 25px; }
  .sub { font-size: 14px; }
  .chip { font-size: 14px; }
  #objective { top: 100px; left: 8px; right: 58px; width: auto; transform: none; padding: 5px 10px; }
  .objTop { font-size: 15px; }
  #objSub { font-size: 13px; }
  #hudRight { top: 8px; right: 8px; }
  .round { width: 40px; height: 40px; }
  #altMeter { display: none; }
  #ticker { left: 8px; right: 8px; bottom: 8px; height: 28px; border-width: 2px; }
  #ticker b { font-size: 12px; padding: 0 7px; }
  #tickerText { font-size: 15px; }
  #tutor { bottom: 44px; padding: 8px 10px; gap: 8px; }
  #tutFace { width: 58px; height: 58px; }
  .tutBody p { font-size: 17px; }
  /* plant menu docks to the bottom of the game view */
  .pop.docked { left: 8px !important; right: 8px; top: auto !important; bottom: 44px; width: auto; }
  #toasts { bottom: calc(var(--navH) + 46px); }
  .row .btn { min-width: 84px; }
}
#sheetGrab { flex: none; text-align: center; padding: 4px 0 0; }
#sheetClose { width: 64px; height: 22px; border: 2px solid var(--ink); border-radius: 12px; background: var(--pn2); color: var(--dim); font-size: 14px; line-height: 16px; padding: 0; }
@media (max-width: 760px) { #hud { inset: env(safe-area-inset-top, 0px) 0 0 0; } }
@media (max-width: 380px) {
  .money { font-size: 22px; }
  #tabs button { font-size: 17px; }
}
/* narrow game view (side panel open on a smallish window): stack the objective under the money card */
@container stage (max-width: 760px) and (min-width: 1px) {
  #objective { top: 112px; left: 10px; right: 62px; width: auto; transform: none; padding: 6px 10px; }
  .objTop { font-size: 16px; }
  #altMeter { top: 190px; }
}
@container stage (max-height: 560px) {
  #altMeter { display: none; }
}
/* short game view (phone landscape, small laptop windows): one compact HUD row */
@container stage (max-height: 480px) {
  #hudLeft { top: 6px; left: 6px; padding: 4px 8px; min-width: 0; width: 150px; }
  .money { font-size: 19px; }
  #hudLeft .sub { font-size: 12px; }
  .chip { font-size: 12px; padding: 0 6px; }
  #objective { top: 6px; left: 164px; right: 52px; width: auto; transform: none; padding: 4px 8px; }
  .objTop { font-size: 13px; }
  .objIcon { font-size: 15px; }
  #objSub { font-size: 11px; }
  #objective .bar { height: 8px; margin: 3px 0 1px; }
  #hudRight { top: 6px; right: 6px; gap: 4px; }
  .round { width: 34px; height: 34px; font-size: 15px; }
  #ticker { display: none; }
  #tutor { bottom: 8px; padding: 6px 10px; }
  #tutFace { width: 48px; height: 48px; }
  .tutBody p { font-size: 15px; margin: 1px 0 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
}

</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="hudLeft" class="card">
        <div id="hudMoney" class="money">$0</div>
        <div class="sub"><span id="hudIps">$0</span>/sec</div>
        <div class="chips">
          <span id="hudSocks" class="chip" title="Socks: catch them, spend them on automation">🧦 <b id="hudSockN">0</b></span>
          <span id="hudMulch" class="chip" title="Mulch: from composting, spend on permanent perks">🪱 <b id="hudMulchN">0</b></span>
        </div>
        <div id="hudBuffs"></div>
      </div>
      <button id="objective" class="card" title="Your goal">

<script>/* js/econ.js */
/* Gerald Wants Up — economy.
   Pure functions over the save state S, shared with tools/sim.js so the balance
   simulator and the real game can never disagree.

   Money is stored in units of 10^S.u dollars. When numbers get huge the game
   redenominates (S.u += 150, every stored amount / 1e150), so values never hit
   Infinity no matter how long anyone plays. All payouts and prices are computed
   in log-space for the same reason. */
(function (root) {
  const E = {};
  const LN10 = Math.LN10;
  E.GAP = 92;            // px between plants on the stalk
  E.FT = 100;            // feet per slot (one plant = one slot of height)
  E.MIN_COMPOST = 8;     // plants needed before Wormsley will eat them
  E.BASE_SPIT = 1.6;     // seconds between beans at the start
  E.MIN_SPIT = 0.11;     // fastest bean interval; extra speed turns into bean value
  E.GOLD_X = 6;          // golden bean payout multiplier
  E.CAP0 = 10;           // every plant slot starts capped at this level...
  E.CAPSTEP = 5;         // ...and each compost raises the cap of every slot you had grown by this much

  /* ---------- Tunables (tools/sim.js can override via GWU_K) ---------- */
  E.K = {
    pb: 3,      // payout ratio between neighbouring plants
    a0: 3.3,    // sprout cost ratio for the first plants...
    pa: 6.0,    // ...ramping up to this ratio...
    ramp: 14,   // ...over this many plants
    p0: 4,      // first sprout cost scale
    lp: 1.2,    // payout growth per level
    lq: 1.7,    // upgrade cost growth per level
    lc: 4,      // upgrade cost scale (x plant base)
    ms: 10,     // every ms levels: payout x2 (so hitting the starting cap of 10 doubles a plant)
    mr: 1.1,    // mulch ratio per extra plant at compost
    mf: 0.35,   // share of the grown stalk the compost mountain keeps
  };
  if (typeof process !== 'undefined' && process.env && process.env.GWU_K) Object.assign(E.K, JSON.parse(process.env.GWU_K));
  const K = E.K;

  /* ---------- Sky Shop: bought with $, reset by composting ---------- */
  E.SHOP = [
    { id: 'spit',  name: 'Spicy Spit',      desc: 'Gerald spits beans 11% faster',          c: 15,  g: 3.6, max: 25 },
    { id: 'gold',  name: 'Bean Polish',     desc: '+2% chance of a golden bean (pays x6)', c: 120, g: 3.6, max: 10 },
    { id: 'cheap', name: 'Coupon Clipping', desc: 'Sprouting new plants costs 7% less',    c: 400, g: 4.2, max: 10 },
    { id: 'rate',  name: 'Gossipy Sky',     desc: 'Socks fall 10% more often',             c: 250, g: 4.0, max: 8 },
    { id: 'val',   name: 'Fancier Socks',   desc: 'Socks are worth 15% more',              c: 600, g: 4.6, max: 10 },
  ];

  /* ---------- Mulch perks: bought with mulch, permanent ---------- */
  E.PERKS = [
    { id: 'pay',   name: 'Fertilized Beans',  desc: 'All payouts x1.5',                                       c: 1,  g: 1.9, max: 400 },
    { id: 'head',  name: 'Head Start',        desc: 'Start each run with +1 free plant',                      c: 4,  g: 2.8, max: 5 },
    { id: 'shop',  name: 'Shop Steward',      desc: 'Auto-buys Sky Shop upgrades (Spicy Spit, Fancier Socks...) when you can afford them', c: 25, g: 1, max: 1 },
    { id: 'worm',  name: 'Wormsley Appetite', desc: '+25% mulch from composting',                              c: 2,  g: 1.9, max: 40 },
    { id: 'dirt',  name: 'Dense Compost',     desc: 'Mountain keeps +5% more of your stalk',                  c: 4,  g: 2.4, max: 5 },
    { id: 'spit2', name: 'Spit Coach',        desc: 'Beans 6% faster, forever',                               c: 3,  g: 2.0, max: 15 },
    { id: 'sockm', name: 'Sock Magnet',       desc: 'Socks worth x1.3',                                       c: 5,  g: 3.0, max: 6 },
    { id: 'rain',  name: 'Sock Rain',         desc: 'Socks fall 12% more often',                              c: 4,  g: 2.4, max: 6 },
    { id: 'gold2', name: 'Golden Gut',        desc: '+1.5% golden bean chance, forever',                      c: 5,  g: 2.4, max: 6 },
    { id: 'visit', name: 'Weirdo Magnet',     desc: 'Weird visitors show up 15% more often',                 c: 5,  g: 2.6, max: 5 },
    { id: 'away',  name: 'Night Shift',       desc: 'Offline earnings +15% and +2h cap',                      c: 4,  g: 2.2, max: 5 },
  ];

  /* ---------- Zones: altitude thresholds in slots ---------- */
  // Hand-made zones first, then procedurally generated layers forever.
  E.ZONE_AT = [0, 12, 26, 44, 66, 92, 122, 160, 205, 258, 318, 386, 462, 546, 640];
  E.STORY_ZONES = E.ZONE_AT.length;
  const zc = [];
  E.zoneAt = k => {
    if (k < E.ZONE_AT.length) return E.ZONE_AT[k];
    while (zc.length <= k - E.ZONE_AT.length) {
      const j = zc.length, prev = j ? zc[j - 1] : E.ZONE_AT[E.ZONE_AT.length - 1];
      zc.push(prev + 110 + 15 * j + 3 * j * j);   // endless layers spread out more and more
    }
    return zc[k - E.ZONE_AT.length];
  };
  E.zoneOf = slots => { let k = 0; while (E.zoneAt(k + 1) <= slots) k++; return k; };

  /* ---------- helpers ---------- */
  const lv = (S, i) => S.lv[i] || 0;
  // level cap: +5 per compost the slot survived, but lower plants top out lower (the bottom plant stays at 10)
  E.capMax = i => E.CAP0 + 3 * i;
  E.cap = (S, i) => Math.min(E.capMax(i), E.CAP0 + E.CAPSTEP * ((S.caps && S.caps[i]) || 0));
  E.shopL = (S, id) => S.shop[id] || 0;
  E.perkL = (S, id) => S.perk[id] || 0;
  E.cost = (d, l) => Math.ceil(d.c * d.g ** l);          // perk price in mulch
  E.shopCost = (S, d, l) => d.c * d.g ** l / 10 ** S.u;  // shop price in current money units

  /* ---------- relics & trinkets ---------- */
  E.lnRelic = (S, key) => {
    let s = 0;
    const R = root.RELICS || [];
    for (const r of R) if (S.relics[r.id] && r.k === key) s += Math.log(r.v);
    if (S.trinkets) for (const t of S.trinkets) if (t.k === key) s += Math.log(t.v);
    return s;
  };
  E.relicMult = (S, key) => Math.exp(E.lnRelic(S, key));
  E.relicAdd = (S, key) => {          // additive relics (golden chance)
    let s = 0;
    const R = root.RELICS || [];
    for (const r of R) if (S.relics[r.id] && r.k === key) s += r.v;
    if (S.trinkets) for (const t of S.trinkets) if (t.k === key) s += t.v;
    return s;
  };

  /* ---------- plants (log-space) ---------- */
  const lnC = [Math.log(K.p0)];
  E.lnSp = i => {
    while (lnC.length <= i) {
      const j = lnC.length - 1;
      lnC.push(lnC[j] + Math.log(Math.min(K.pa, K.a0 + (K.pa - K.a0) * j / K.ramp)));
    }
    return lnC[i];
  };
  E.lnBase = i => i * Math.log(K.pb);
  E.lnLv = l => l * Math.log(K.lp) + Math.floor(l / K.ms) * Math.LN2;
  E.lvMult = l => Math.exp(E.lnLv(l));
  E.mtnMult = S => (1 + S.mtn / 15) ** 2;     // polynomial on purpose: exponential here runs away
  E.zoneMult = S => 1.35 ** S.zone;
  E.mulchMult = S => 1 + 0.1 * S.tm;
  E.lnGlobal = S =>
    Math.log(E.mulchMult(S)) + E.perkL(S, 'pay') * Math.log(1.5) + Math.log(E.mtnMult(S)) +
    S.zone * Math.log(1.35) + E.lnRelic(S, 'pay');
  E.globalMult = S => Math.exp(E.lnGlobal(S));
  E.lnUnit = S => S.u * LN10;
  // payout per bean hit, in money units (buff = temporary multiplier)
  E.pay = (S, i, buff = 1) => Math.exp(E.lnBase(i) + E.lnLv(lv(S, i)) + E.lnGlobal(S) - E.lnUnit(S)) * buff;
  E.upC = (S, i, l) => Math.exp(E.lnBase(i) + Math.log(K.lc) + l * Math.log(K.lq) - E.lnUnit(S));
  E.spC = (S, i) => Math.exp(E.lnSp(i) - E.lnUnit(S)) * 0.93 ** E.shopL(S, 'cheap');
  // how many levels of plant i are affordable with money m (closed form, no loops)
  E.upAfford = (S, i, m) => {
    const c = E.upC(S, i, lv(S, i)), q = K.lq, room = E.cap(S, i) - lv(S, i);
    if (m < c || room <= 0) return [0, 0];
    const n = Math.min(room, Math.floor(Math.log(1 + m * (q - 1) / c) / Math.log(q)));
    return [n, c * (q ** n - 1) / (q - 1)];
  };

  /* ---------- beans ---------- */
  E.rawSpit = S => E.BASE_SPIT * 0.89 ** E.shopL(S, 'spit') * 0.94 ** E.perkL(S, 'spit2') / E.relicMult(S, 'spit');
  E.spitInt = S => Math.max(E.MIN_SPIT, E.rawSpit(S));
  E.beanX = S => Math.max(1, E.MIN_SPIT / E.rawSpit(S));    // overflow speed -> bean value
  E.goldChance = S => Math.min(0.5, 0.02 * E.shopL(S, 'gold') + 0.015 * E.perkL(S, 'gold2') + E.relicAdd(S, 'gold'));
  E.goldAvg = S => 1 + E.goldChance(S) * (E.GOLD_X - 1);
  E.sumPay = (S, buff = 1) => { let s = 0; for (let i = 0; i < S.n; i++) s += E.pay(S, i, buff); return s; };
  // income per second if every bubble were collected (offline, UI, quests)
  E.ips = (S, buff = 1) => E.sumPay(S, buff) * E.beanX(S) * E.goldAvg(S) / E.spitInt(S);

  /* ---------- socks ---------- */
  E.sockInt = S => Math.max(4, 15 * 0.9 ** E.shopL(S, 'rate') * 0.88 ** E.perkL(S, 'rain') / E.relicMult(S, 'sockRate'));
  E.sockVal = S => Math.ceil((1 + S.zone / 3) * 1.15 ** E.shopL(S, 'val') * 1.3 ** E.perkL(S, 'sockm') * E.relicMult(S, 'sockVal'));
  // sock automation prices grow with the plant slot, so socks stay worth catching all game
  // Sock prices are counted in "catches": a sock is worth about sockUnit at your zone (before sock perks),
  // so a forever upgrade is ~5 caught socks, auto-upgrade ~3, this-run auto-collect ~1.5, at any point in
  // the game. Higher plant slots cost a little more. Sock perks/shop make each catch worth more.
  E.sockUnit = S => 1 + S.zone / 3;
  E.sockSlot = i => 1 + i / 30;
  E.cUa = (S, i) => Math.ceil(3 * E.sockUnit(S) * E.sockSlot(i));     // auto-upgrade forever
  E.cAc = (S, i) => Math.ceil(1.5 * E.sockUnit(S) * E.sockSlot(i));   // auto-collect this run
  E.cPa = (S, i) => Math.ceil(5 * E.sockUnit(S) * E.sockSlot(i));     // auto-collect forever
  E.shrine = (S, kind) => Math.ceil((kind === "gold" ? 10 : 8) * E.sockUnit(S));   // Sock Shrine: socks -> a buff
  E.SUPER_SOCK = 5000;                         // Sock Butler: auto-buys both forever automations for each new plant

  /* ---------- compost ---------- */
  // Wormsley only eats a stalk taller than the last one he ate (stops compost spamming)
  E.compostNeed = S => Math.max(E.MIN_COMPOST, (S.lastN || 0) + 1);
  E.mulchGain = S => {
    if (S.n < E.compostNeed(S)) return 0;
    return Math.floor(K.mr ** (S.n - 3) * (1 + 0.25 * E.perkL(S, 'worm')) * E.relicMult(S, 'mulch'));
  };
  E.mtnFrac = S => K.mf + 0.05 * E.perkL(S, 'dirt');
  E.mtnGain = S => Math.floor(Math.max(0, S.n - E.perkL(S, 'head')) * E.mtnFrac(S));   // free head-start plants don't count
  E.alt = S => S.mtn + S.n;              // stalk top in slots
  E.headStart = S => 1 + E.perkL(S, 'head');

  /* ---------- offline ---------- */
  E.offRate = S => Math.min(1, (0.4 + 0.15 * E.perkL(S, 'away')) * E.relicMult(S, 'off'));
  E.offCap = S => (8 + 2 * E.perkL(S, 'away')) * 3600;

  /* ---------- visitors ---------- */
  E.visitInt = S => Math.max(30, 90 * 0.85 ** E.perkL(S, 'visit') / E.relicMult(S, 'visit'));

  /* ---------- redenomination ---------- */
  // Returns the shift (in powers of ten) to apply to every stored amount, or 0.
  E.needShift = S => (S.m > 1e200 || S.run > 1e200) ? 150 : 0;

  root.ECON = E;
  if (typeof module !== 'undefined') module.exports = E;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>/* js/ink.js */
/* Gerald Wants Up — shared hand-drawn ink primitives.
   Everything is outlined in INK.C.ink. Shapes "boil" (re-jitter ~7 times a second)
   to look hand-drawn: call INK.setTime(t) once per frame (main.js / cutscene.js do). */
const INK = {
  C: {
    ink: "#1d0f2b", cream: "#fff3dc", or: "#ff9a3c", lil: "#c58bff", moss: "#7be07b", gold: "#ffd23f",
    pink: "#ff7eb6", sky: "#6ad1ff", red: "#ff5a5a", leaf: "#5fb85a", leafD: "#3f8f3f", soil: "#6b4226",
    bean: "#b5763a", white: "#ffffff",
  },
  FONT: '"Chewy", "Comic Sans MS", "Chalkboard SE", cursive',
  HAND: '"Gaegu", "Comic Sans MS", "Chalkboard SE", cursive',
  t: 0, boil: 0,
  setTime(t) { INK.t = t; INK.boil = Math.floor(t * 7); },

  /* noise: j() changes every boil frame, n() is static. Both return [-1, 1]. */
  _h(a, b) {
    let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul((b | 0) + 0x632be5ab, 0xc2b2ae35);
    h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 15;
    return ((h >>> 0) / 4294967295) * 2 - 1;
  },
  j(seed, k = 0) { return INK._h(seed * 97 + k, INK.boil * 131 + k); },
  n(seed, k = 0) { return INK._h(seed * 53 + k * 7919, k); },

  /* wobbly closed blob approximating an ellipse */
  blobPath(ctx, x, y, rx, ry, seed = 0, amt = 0.05, pts = 9) {
    const P = [];
    for (let k = 0; k < pts; k++) {
      const a = (k / pts) * Math.PI * 2, r = 1 + amt * (INK.j(seed, k) * 0.6 + INK.n(seed, k) * 0.4);
      P.push([x + Math.cos(a) * rx * r, y + Math.sin(a) * ry * r]);
    }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    ctx.beginPath();
    const m0 = mid(P[0], P[1]);
    ctx.moveTo(m0[0], m0[1]);
    for (let k = 1; k <= pts; k++) {
      const c = P[k % pts], m = mid(P[k % pts], P[(k + 1) % pts]);
      ctx.quadraticCurveTo(c[0], c[1], m[0], m[1]);
    }
    ctx.closePath();
  },
  /* fill with `fill` (skip if falsy) and stroke with the CURRENT strokeStyle/lineWidth if stroke */
  blob(ctx, x, y, rx, ry, fill, stroke = true, seed = 0, amt = 0.05) {
    INK.blobPath(ctx, x, y, rx, ry, seed, amt);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) ctx.stroke();
  },
  oval(ctx, x, y, rx, ry, fill, stroke = false) {
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, Math.PI * 2);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) ctx.stroke();
  },
  /* wobbly polygon / polyline: pts = [[x,y],...], jitter in px */
  wpoly(ctx, pts, fill, stroke = true, seed = 0, amt = 1.2) {
    ctx.beginPath();
    pts.forEach((p, k) => {
      const x = p[0] + INK.j(seed, k) * amt, y = p[1] + INK.j(seed + 5, k) * amt;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) ctx.stroke();
  },
  wline(ctx, pts, seed = 0, amt = 1.2) {
    ctx.beginPath();
    pts.forEach((p, k) => {
      const x = p[0] + INK.j(seed, k) * amt, y = p[1] + INK.j(seed + 5, k) * amt;
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  },
  /* outlined text */
  label(ctx, text, x, y, size = 15, col = INK.C.cream, align = "center", font = INK.FONT, lw = 4) {
    ctx.font = size + "px " + font;
    ctx.textAlign = align; ctx.textBaseline = "alphabetic";
    ctx.lineJoin = "round"; ctx.lineWidth = lw; ctx.strokeStyle = INK.C.ink;
    ctx.strokeText(text, x, y);
    ctx.fillStyle = col; ctx.fillText(text, x, y);
  },
  /* googly eye. look = {x,y} roughly unit vector toward what it looks at.
     o.blink 0..1 (1 = closed), o.style 'round'|'sleepy'|'wide'|'side'|'spiral', o.pupil (0..1 size), o.lid colour */
  eye(ctx, x, y, r, look = { x: 0, y: 0 }, o = {}) {
    const st = o.style || "round", lw = ctx.lineWidth;
    ctx.lineWidth = Math.max(1.5, r * 0.22);
    INK.blob(ctx, x, y, r, r * (st === "wide" ? 1.15 : 1), "#fff", true, (x * 13 + y * 7) | 0, 0.04);
    let lx = look.x || 0, ly = look.y || 0;
    if (st === "side") { lx = 1; ly = 0; }
    const m = Math.hypot(lx, ly) || 1, k = Math.min(1, m) * r * 0.42;
    const px = x + (lx / m) * k, py = y + (ly / m) * k, pr = r * (o.pupil || (st === "wide" ? 0.32 : 0.45));
    if (st === "spiral") {
      ctx.beginPath();
      for (let a = 0; a < 12; a += 0.4) ctx.lineTo(x + Math.cos(a + INK.t * 6) * a * r * 0.07, y + Math.sin(a + INK.t * 6) * a * r * 0.07);
      ctx.strokeStyle = INK.C.ink; ctx.stroke();
    } else {
      INK.oval(ctx, px, py, pr, pr, INK.C.ink);
      INK.oval(ctx, px - pr * 0.35, py - pr * 0.35, pr * 0.3, pr * 0.3, "#fff");
    }
    const lid = Math.max(o.blink || 0, st === "sleepy" ? 0.45 : 0);
    if (lid > 0.02) {
      ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, r, r, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = o.lid || "#8fd18f"; ctx.fillRect(x - r - 2, y - r - 2, r * 2 + 4, (r * 2 + 4) * lid);
      ctx.beginPath(); ctx.moveTo(x - r, y - r + r * 2 * lid); ctx.lineTo(x + r, y - r + r * 2 * lid);
      ctx.strokeStyle = INK.C.ink; ctx.stroke(); ctx.restore();
    }
    ctx.lineWidth = lw;
  },
  /* colour helpers (hex in, css out) */
  rgb(hex) {
    let h = hex.replace("#", "");
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    const n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  rgba(hex, a) { const c = INK.rgb(hex); return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")"; },
  /* amt > 0 lightens toward white, amt < 0 darkens toward black; returns hex */
  shade(hex, amt) {
    const c = INK.rgb(hex).map(v => Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)));
    return "#" + c.map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
  },
  mix(a, b, t) {
    const A = INK.rgb(a), B = INK.rgb(b);
    return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
  },
  hsl(h, s, l) {   // -> hex
    s /= 100; l /= 100;
    const f = n => { const k = (n + h / 30) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return "#" + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
  },
};

<script>/* js/util.js */
/* Gerald Wants Up — small helpers + number formatting. */
const U = {
  clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
  lerp: (a, b, t) => a + (b - a) * t,
  smooth: t => t * t * (3 - 2 * t),
  easeOutBack: t => { const c = 1.70158; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; },
  easeOutElastic: t => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
  easeInOut: t => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2),
  /* seeded RNG (mulberry32): U.rng(seed)() -> [0,1) */
  rng(a) {
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  },
  pick: (arr, r = Math.random) => arr[Math.floor(r() * arr.length)],
  /* number formatting from log10 so nothing ever overflows */
  SUF: ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc", "UDc", "DDc", "TDc", "QaDc", "QiDc", "SxDc", "SpDc", "OcDc", "NoDc", "Vg"],
  fmtLog(l) {
    if (!isFinite(l)) return "0";
    if (l < 3) { const v = 10 ** l; return v < 10 && v % 1 ? v.toFixed(1) : Math.floor(v + 1e-9) + ""; }
    let e3 = Math.floor(l / 3), m3 = 10 ** (l - e3 * 3);
    if (+m3.toFixed(2) >= 1000) { e3++; m3 /= 1000; }          // 999.996 must read 1.00K, not 1000.00
    const sci = typeof G !== "undefined" && G.S && G.S.settings && G.S.settings.sci;
    if (!sci && e3 < U.SUF.length) return m3.toFixed(2) + U.SUF[e3];
    let e = Math.floor(l), m = 10 ** (l - e);
    if (+m.toFixed(2) >= 10) { e++; m /= 10; }
    return m.toFixed(2) + "e" + e;
  },
  num: x => (x <= 0 ? "0" : x < 1000 ? (x < 10 && x % 1 ? x.toFixed(1) : Math.floor(x) + "") : U.fmtLog(Math.log10(x))),
  /* money values are stored in units of 10^S.u */
  money: x => "$" + (x <= 0 ? "0" : U.fmtLog(Math.log10(x) + ((typeof G !== "undefined" && G.S && G.S.u) || 0))),
  ft: slots => { const f = Math.max(0, Math.round(slots * 100)); return (f < 1e6 ? f.toLocaleString("en-US") : U.fmtLog(Math.log10(f))) + " ft"; },
  time(sec) {
    sec = Math.floor(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h ? h + "h " + m + "m" : m ? m + "m " + s + "s" : s + "s";
  },
};

<script>/* js/zones.js */
/* Gerald Wants Up — zone lookup. Story zones come from DATA.ZONES; after the story,
   endless procedural layers are generated deterministically from the zone index. */
const ZONES = {
  _c: {},
  get(k) {
    if (ZONES._c[k]) return ZONES._c[k];
    let z;
    if (k < DATA.ZONES.length) {
      z = Object.assign({ k, at: ECON.zoneAt(k), proc: false }, DATA.ZONES[k]);
      if (z.arrive) z.arrive = z.arrive.map(([who, text]) => [who, text.split("{ft}").join(U.ft(z.at))]);
    } else {
      const r = U.rng(9973 * k + 17), P = DATA.PROC;
      const adj = U.pick(P.adj, r), place = U.pick(P.place, r);
      const h = Math.floor(r() * 360), h2 = (h + 20 + r() * 80) % 360, dark = r() < 0.5;
      const local = U.pick(P.names, r) + ", " + U.pick(P.titles, r) + " " + adj + " " + place;
      const scales = ["major", "minor", "dorian", "lydian", "mixo", "penta", "phryg", "whole"];
      const k2 = k - DATA.ZONES.length + 1;
      const tk = ["pay", "pay", "mulch", "sockVal", "spit", "visit", "gold", "off"][Math.floor(r() * 8)];
      const tv = { pay: 1.15, mulch: 1.06, sockVal: 1.2, spit: 1.03, visit: 1.05, gold: 0.005, off: 1.1 }[tk];
      z = {
        k, at: ECON.zoneAt(k), proc: true,
        name: "Layer " + k2 + ": The " + adj + " " + place, short: "The " + adj + " " + place,
        sub: U.pick(["Nobody knows who built this.", "It smells faintly of soup.", "Gravity is optional here.",
          "Everything is slightly too big.", "The walls are listening. Politely.", "It's always 4:17pm here.",
          "Something here is humming your favourite song.", "Population: unclear."], r),
        sky: dark ? [INK.hsl(h, 55, 9), INK.hsl(h2, 50, 28)] : [INK.hsl(h, 60, 55), INK.hsl(h2, 70, 85)],
        stars: dark ? 0.6 + r() * 0.4 : r() * 0.2,
        decor: U.pick(P.decor, r),
        mus: [55 + Math.floor(r() * 12), U.pick(scales, r), 70 + Math.floor(r() * 45)],
        who: "local", whoName: local,
        arrive: [["narr", U.ft(ECON.zoneAt(k)) + ". " + "Layer " + k2 + ": The " + adj + " " + place + "."],
          ["local", U.pick(P.greet, r)], ["gerald", U.pick(P.gerald, r)]],
        trinket: { name: "A " + U.pick(P.trinketAdj, r) + " " + U.pick(P.trinketObj, r), k: tk, v: tv,
          desc: { pay: "Payouts x1.15", mulch: "Mulch +6%", sockVal: "Socks worth +20%", spit: "Beans 3% faster",
            visit: "Visitors 5% more often", gold: "+0.5% golden bean chance", off: "Offline earnings x1.1" }[tk] },
        visitors: (() => { const all = Object.keys(DATA.VISITORS); return [U.pick(all, r), U.pick(all, r), U.pick(all, r)]; })(),
        obj: "Keep going up. Forever. Up is always there.",
        quips: [], hue: h,
      };
    }
    return (ZONES._c[k] = z);
  },
  /* objective shown while heading to zone k */
  objective(k) { return ZONES.get(k).obj; },
};

<script>/* js/audio.js */
/* Gerald Wants Up — SFX: every sound and all music synthesized live with the Web Audio API (no files).
   Public API (CONTRACT.md): init, setVolume, play, music, setMusicOn, duck, cue.
   Every call is a silent no-op before init() or when Web Audio is unavailable.
   Graph: sfx bus ─┐                         ┌─> reverb (shared convolver)
          players -> musIn -> hp -> lp -> wow delay -> mus (vol/duck) ─┤
          cue bus ──┴──────────────────────────────> master -> soft compressor -> out
   Music: one lookahead scheduler (setInterval 25 ms, ~0.12 s ahead) drives 1-2 Players (crossfade).
   Each finished voice disconnects all of its nodes (see ve()). Extras for tools: _stats, _render, names. */
const SFX = (() => {
  "use strict";
  let ac = null, B = null, NB = null, timer = 0, unlockBound = false;
  let sfxVol = 0.7, musVol = 0.5, musicOn = true, ducked = false, cueDuckUntil = 0;
  const MUS_BASE = 0.6, SFX_BASE = 0.9, players = [];
  let want = null;                                   // last zone asked for by music()
  let key = { hb: 60, pent: [0, 2, 4, 7, 9] };       // hits/jingles follow the current music key
  const stats = { steps: 0, notes: 0, live: 0, maxLive: 0, sfx: 0, dropped: 0, hitDrop: 0, players: 0, zone: -1, bar: 0, loop: 0, state: "none" };

  const SC = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10],
    lydian: [0, 2, 4, 6, 7, 9, 11], mixo: [0, 2, 4, 5, 7, 9, 10], penta: [0, 2, 4, 7, 9],

    for (let i = 0; i < ne; i++) INK.eye(ctx, E[i][0], E[i][1], E[i][2], L, eo);

    if (hat !== "none") { ctx.save(); ctx.translate(0, top + 2); DRAW.hat(ctx, hat, 34); ctx.restore(); }
  },
};

<script>/* js/icons.js */
/* Gerald Wants Up — little animated pictures for quests (DRAW.questIcon), built from the
   game's own drawings so they match. Loaded after draw.js. */
const ICONS = {
  PLANT: { i: 0, type: "daisy", c1: "#ff7eb6", c2: "#ffd23f", hue: 330, eyes: 2, eyeStyle: "round", mouth: "smile", acc: "none", pt: 6, seed: 7 },
  SPROUT: { i: 0, type: "fern", c1: "#7be07b", c2: "#ffd23f", hue: 120, eyes: 2, eyeStyle: "round", mouth: "o", acc: "none", pt: 5, seed: 11 },
  ink(ctx, w) { ctx.strokeStyle = INK.C.ink; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; },
  cursor(ctx, x, y, s, press) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s * (press ? 0.88 : 1), s * (press ? 0.88 : 1)); ICONS.ink(ctx, 1.6);
    INK.wpoly(ctx, [[0, 0], [0, 15], [4, 11.5], [6.5, 17.5], [9.5, 16.3], [7, 10.5], [12, 10.5]], "#ffffff", true, 3, 0.4);
    ctx.restore();
  },
  arrow(ctx, x, y, s, col) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ICONS.ink(ctx, 2);
    INK.wpoly(ctx, [[0, -12], [9, -1], [4, -1], [4, 10], [-4, 10], [-4, -1], [-9, -1]], col, true, 5, 0.5);
    ctx.restore();
  },
  star(ctx, x, y, r, col) {
    const p = [];
    for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.48 : r; p.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
    ICONS.ink(ctx, 2); INK.wpoly(ctx, p, col, true, 9, 0.5);
  },
  sparkle(ctx, x, y, r, t) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 2); ctx.globalAlpha *= 0.6 + 0.4 * Math.sin(t * 7);
    ctx.fillStyle = "#fff6c0"; ctx.beginPath();
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = k % 2 ? r * 0.3 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.fill(); ctx.restore();
  },
  dirt(ctx, y, w) { ICONS.ink(ctx, 2); INK.blob(ctx, 0, y, w, 6, "#7a4e2d", true, 21, 0.1); },
  /* size: the box the picture must fit in (about 50) */
  draw(ctx, type, size, t) {
    const s = (size || 50) / 50;
    ctx.save(); ctx.scale(s, s);
    const f = ICONS.T[type] || ICONS.T.unknown;
    try { f(ctx, t || 0); } catch (e) { /* a broken picture must never break the quest list */ }
    ctx.restore();
  },
};
ICONS.T = {
  bubbles(ctx, t) {            // a coin bubble popping up next to a little plant
    ctx.save(); ctx.translate(-10, -6); ctx.scale(0.5, 0.5); DRAW.plant(ctx, ICONS.PLANT, { t, look: { x: 1, y: -0.3 } }); ctx.restore();
    const ph = (t * 0.9) % 1, y = 12 - ph * 24, r = 8 + ph * 3;
    if (ph < 0.86) { ctx.save(); ctx.translate(15, y); DRAW.bubble(ctx, r, t); ctx.restore(); }
    else { ICONS.ink(ctx, 2); for (let k = 0; k < 6; k++) { const a = k * 1.05; INK.oval(ctx, 13 + Math.cos(a) * 11, y + Math.sin(a) * 11, 2, 2, "#bfe9ff"); } ctx.save(); ctx.translate(13, y); DRAW.coin(ctx, 6); ctx.restore(); }
  },
  pokes(ctx, t) {              // a cursor poking Gerald, who flinches
    const ph = (t * 1.3) % 1, hit = ph > 0.45 && ph < 0.65;
    ctx.save(); ctx.translate(-4, 2); ctx.scale(0.42, 0.42);
    DRAW.gerald(ctx, { t, mood: hit ? "shock" : "grump", look: { x: 1, y: 0.4 }, hat: "none", spit: hit ? 0.8 : 0, neck: false });
    ctx.restore();
    if (hit) { ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 2; INK.oval(ctx, 7, 4, 6 + (ph - 0.45) * 30, 6 + (ph - 0.45) * 30, null, true); }
    const k = ph < 0.45 ? ph / 0.45 : ph < 0.65 ? 1 : 1 - (ph - 0.65) / 0.35;
    ICONS.cursor(ctx, 20 - k * 12, 16 - k * 10, 1.25, hit);
  },
  sprouts(ctx, t) {            // a sprout popping out of the dirt, with a +
    const ph = (t * 0.7) % 1, g = U.easeOutBack(Math.min(1, ph * 1.6));
    ICONS.dirt(ctx, 17, 17);
    ctx.save(); ctx.translate(-3, -6); ctx.scale(0.5 * g, 0.5 * g); DRAW.plant(ctx, ICONS.SPROUT, { t, look: { x: 0, y: 0.3 } }); ctx.restore();
    INK.label(ctx, "+", 15, -6, 22, INK.C.moss);
  },
  socks(ctx, t) {              // a falling sock and a cursor catching it
    const ph = (t * 0.8) % 1, y = -20 + ph * 26;
    ctx.save(); ctx.translate(-4, y); ctx.rotate(Math.sin(t * 4) * 0.4); ctx.scale(0.55, 0.55); DRAW.sock(ctx, 1, t, 3); ctx.restore();
    ICONS.cursor(ctx, 6, 8, 1.2, ph > 0.85);
  },
  upgrades(ctx, t) {           // a plant with a bouncing green up arrow
    ctx.save(); ctx.translate(-8, -6); ctx.scale(0.5, 0.5); DRAW.plant(ctx, ICONS.PLANT, { t, look: { x: 1, y: -0.5 } }); ctx.restore();
    ICONS.arrow(ctx, 14, -2 - Math.abs(Math.sin(t * 4)) * 5, 0.95, INK.C.moss);
  },
  beans(ctx, t) {              // Gerald spitting beans
    const ph = (t * 1.1) % 1;
    ctx.save(); ctx.translate(-10, -6); ctx.scale(0.36, 0.36); DRAW.gerald(ctx, { t, spit: ph < 0.3 ? 1 : 0, look: { x: 1, y: 0.5 }, hat: "none", neck: false }); ctx.restore();
    for (let k = 0; k < 3; k++) {
      const q = (ph + k / 3) % 1, x = -4 + q * 24, y = 2 + q * q * 16;
      ctx.save(); ctx.translate(x, y); ctx.rotate(q * 8); ctx.scale(0.75, 0.75); DRAW.bean(ctx, false, t, k); ctx.restore();
    }
  },
  golden(ctx, t) {             // a sparkling golden bean
    ctx.save(); ctx.rotate(Math.sin(t * 2) * 0.3); ctx.scale(1.9, 1.9); DRAW.bean(ctx, true, t, 4); ctx.restore();
    ICONS.sparkle(ctx, -14, -12, 6, t); ICONS.sparkle(ctx, 15, -8, 5, t + 1); ICONS.sparkle(ctx, 10, 14, 4, t + 2);
  },
  visitors(ctx, t) {           // a weird winged eyeball with sparkles
    ctx.save(); ctx.translate(0, Math.sin(t * 3) * 3); ctx.scale(0.45, 0.45); DRAW.visitor(ctx, DATA.VISITORS.eyewing, t); ctx.restore();
    ICONS.sparkle(ctx, -17, -14, 5, t); ICONS.sparkle(ctx, 17, 12, 5, t + 1.5);
  },
  earn(ctx, t) {               // a bouncing stack of coins
    for (let k = 0; k < 3; k++) {
      const b = Math.max(0, Math.sin(t * 5 - k * 0.6)) * 4;
      ctx.save(); ctx.translate(-8 + k * 8, 12 - k * 9 - b); DRAW.coin(ctx, 9); ctx.restore();
    }
  },
  tall(ctx, t) {               // the stalk next to a measuring tape
    ICONS.ink(ctx, 8); ctx.beginPath(); ctx.moveTo(-6, 22); ctx.quadraticCurveTo(-10 + Math.sin(t * 2) * 2, 0, -6, -20); ctx.stroke();
    ctx.strokeStyle = "#5fb85a"; ctx.lineWidth = 4.5; ctx.stroke();
    ICONS.ink(ctx, 2); INK.wpoly(ctx, [[6, -22], [16, -22], [16, 22], [6, 22]], "#ffd23f", true, 6, 0.4);
    ctx.lineWidth = 1.5; for (let k = 0; k < 9; k++) { const y = -18 + k * 5; ctx.beginPath(); ctx.moveTo(6, y); ctx.lineTo(k % 2 ? 10 : 13, y); ctx.stroke(); }
    ctx.save(); ctx.translate(-6, -21); ctx.scale(0.22, 0.22); DRAW.gerald(ctx, { t, look: { x: 1, y: 0 }, hat: "none", neck: false }); ctx.restore();
  },
  level(ctx, t) {              // a plant with a gold "Lv" star badge
    ctx.save(); ctx.translate(-8, -5); ctx.scale(0.5, 0.5); DRAW.plant(ctx, ICONS.PLANT, { t, look: { x: 1, y: -0.2 } }); ctx.restore();
    const r = 11 + Math.sin(t * 4) * 1.2;
    ICONS.star(ctx, 13, -9, r, INK.C.gold);
    INK.label(ctx, "Lv", 13, -6, 9, INK.C.ink, "center", INK.FONT, 0);
  },
  compost(ctx, t) {            // Wormsley poking out of the dirt
    ctx.save(); ctx.translate(0, 18); DRAW.worm(ctx, { t, size: 11, rise: 0.75 + Math.sin(t * 2) * 0.08, mood: "smug" }); ctx.restore();
    ICONS.dirt(ctx, 19, 19);
  },
  unknown(ctx, t) {            // a little scroll with a question mark
    ICONS.ink(ctx, 2); INK.wpoly(ctx, [[-14, -16], [14, -16], [14, 16], [-14, 16]], "#fff3dc", true, 8, 0.6);
    INK.label(ctx, "?", 0, 8, 22, INK.C.lil);
  },
};
ICONS.T.visit = ICONS.T.visitors;
if (typeof DRAW !== "undefined" && !DRAW.questIcon) DRAW.questIcon = (ctx, type, size, t) => ICONS.draw(ctx, type, size, t);

<script>/* js/world.js */
/* Gerald Wants Up — the world: zone skies, parallax decor for every zone (15 story sets +
   12 procedural sets), the compost mountain, landmarks (signposts, the Moon, Saturn, the Sun)
   and the paper overlay. Everything is seeded (no flicker) and cached (no per-frame canvases
   or gradients). Decor is fogged toward the sky colour so plants + bubbles stay readable. */
const WORLD = (function () {
  const GAP = ECON.GAP, BL = 6, TAU = Math.PI * 2, PI = Math.PI;
  const hr = (a, b) => (INK._h(a, b) + 1) * 0.5;                 // static hash -> [0,1]
  const gS = () => (typeof G !== "undefined" && G && G.S) || null;
  const low = () => { const S = gS(); return !!(S && S.settings && (S.settings.lowfx || S.settings.perf)); };
  let VW = 800, VH = 600;                                         // viewport for look-at maths
  const LK = { x: 0, y: 0 };                                      // reused look vector
  const C = { sky: new Map(), pal: new Map(), fog: new Map(), str: new Map(), img: {}, pat: {}, grad: {} };
  const trim = m => { if (m.size > 500) m.clear(); };
  function canvas(w, h) {
    if (typeof document === "undefined") return null;
    const c = document.createElement("canvas"); c.width = w; c.height = h; return c;
  }
  /* ---------- tiny drawing helpers (current strokeStyle / lineWidth) ---------- */
  function fs(c, f) { if (f) { c.fillStyle = f; c.fill(); } c.stroke(); }
  function ov(c, x, y, rx, ry, f, st) {
    c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU);
    if (f) { c.fillStyle = f; c.fill(); } if (st) c.stroke();
  }
  function bl(c, x, y, rx, ry, f, sd, amt) { INK.blob(c, x, y, rx, ry, f, true, sd, amt === undefined ? 0.06 : amt); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
  }
  function ln(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  function tx(c, s, x, y, px, col, font, al, wt) {
    c.font = (wt || "") + Math.max(6, Math.round(px)) + "px " + (font || INK.FONT);
    c.textAlign = al || "center"; c.textBaseline = "middle"; c.fillStyle = col; c.fillText(s, x, y);
  }
  /* things slowly turn to watch the stalk (and sometimes look away, then slowly turn back) */
  function look(x, y, sd, t) {
    let dx = VW / 2 - x, dy = VH * 0.42 - y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
    const a = U.smooth(U.clamp(0.6 + Math.sin(t * 0.12 + sd * 1.3) * 0.9, 0, 1));
    const rx = Math.cos(sd * 2.1), ry = Math.sin(sd * 2.1) * 0.6;
    LK.x = rx + (dx - rx) * a; LK.y = ry + (dy - ry) * a; return LK;
  }
  function blink(sd, t) {
    const p = 3 + 5 * hr(sd, 77), ph = (t + sd * 0.61) % p;
    return ph < 0.2 ? Math.sin((ph / 0.2) * PI) : 0;
  }
  /* small decor eye: P = fogged palette, lid = sleepy lid colour or null */
  function eye(c, x, y, r, P, sd, t, lid) {
    const b = blink(sd, t);
    if (b > 0.5) { c.beginPath(); c.arc(x, y - r * 0.5, r, 0.2 * PI, 0.8 * PI); c.stroke(); return; }
    ov(c, x, y, r, r, P.w, true);
    const lk = look(x, y, sd, t), k = r * 0.45;
    ov(c, x + lk.x * k, y + lk.y * k, r * 0.5, r * 0.5, P.k, false);
    if (lid) { c.beginPath(); c.ellipse(x, y, r, r, 0, PI, TAU); c.closePath(); fs(c, lid); }
  }
  /* face: s = face width. mood 0 smile, 1 flat, 2 'o', 3 asleep, 4 wobbly, 5 smug (lids) */
  function face(c, x, y, s, P, sd, t, mood, lid) {
    const er = s * 0.17, ex = s * 0.3;
    if (mood === 3) {
      c.beginPath(); c.arc(x - ex, y - er * 0.4, er, 0.2 * PI, 0.8 * PI); c.stroke();
      c.beginPath(); c.arc(x + ex, y - er * 0.4, er, 0.2 * PI, 0.8 * PI); c.stroke();
    } else {
      const l = mood === 5 ? (lid || P.w) : null;
      eye(c, x - ex, y, er, P, sd, t, l); eye(c, x + ex, y, er, P, sd + 1, t, l);
    }
    const my = y + s * 0.32;
    c.beginPath();
    if (mood === 0) c.arc(x, my - s * 0.08, s * 0.14, 0.2 * PI, 0.8 * PI);
    else if (mood === 2 || mood === 3) { c.ellipse(x, my, s * 0.06, s * 0.08, 0, 0, TAU); }
    else if (mood === 4) { c.moveTo(x - s * 0.15, my); c.quadraticCurveTo(x - s * 0.07, my - s * 0.07, x, my); c.quadraticCurveTo(x + s * 0.07, my + s * 0.07, x + s * 0.15, my); }
    else if (mood === 5) { c.moveTo(x - s * 0.12, my); c.quadraticCurveTo(x + s * 0.05, my + s * 0.06, x + s * 0.16, my - s * 0.05); }
    else { c.moveTo(x - s * 0.12, my); c.lineTo(x + s * 0.12, my); }
    c.stroke();
  }
  /* 4-point twinkle star */
  function spark(c, x, y, r, col) {
    c.beginPath(); c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
    c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r); c.fillStyle = col; c.fill();
  }
  /* ---------- layers + palettes ---------- */
  // f parallax factor, n items per period, s scale, fog amount, cb centre-avoid multiplier
  const LAY = [
    { f: 0.1, n: 7, s: 0.66, fog: 0.6, cb: 0.45 },
    { f: 0.24, n: 6, s: 0.95, fog: 0.42, cb: 1 },
    { f: 0.42, n: 4, s: 1.22, fog: 0.3, cb: 1.25 },
  ];
  function fogOf(z) {
    let f = C.fog.get(z.k);
    if (!f) { trim(C.fog); f = INK.mix(z.sky[0], z.sky[1], 0.6); C.fog.set(z.k, f); }
    return f;
  }
  function PAL(name, z, l) {
    const key = name + "|" + z.k + "|" + l;
    let P = C.pal.get(key);
    if (P) return P;
    trim(C.pal);
    const fog = fogOf(z), a = LAY[l].fog * (D[name].fog || 1);
    P = D[name].pal(z).map(col => INK.mix(col, fog, a));
    P.i = INK.mix(INK.C.ink, fog, Math.min(0.85, a * 1.08));
    P.w = INK.mix("#ffffff", fog, a * 0.75);
    P.k = INK.mix(INK.C.ink, fog, a * 0.7);
    P.fog = fog;
    C.pal.set(key, P);
    return P;
  }
  function seedOf(name, z) {
    let h = 7;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    return h + (z.proc ? (z.k * 977) & 0xffff : 0);
  }
  const D = {};   // decor sets, filled in below
  /* ---------- sky ---------- */
  function skyGrad(c, z) {           // unit-height gradient, drawn under scale(1,H): one per zone, any H
    let g = C.sky.get(z.k);
    if (!g) {
      if (C.sky.size > 60) C.sky.clear();
      g = c.createLinearGradient(0, 0, 0, 1);
      g.addColorStop(0, z.sky[0]); g.addColorStop(0.55, INK.mix(z.sky[0], z.sky[1], 0.62)); g.addColorStop(1, z.sky[1]);
      C.sky.set(z.k, g);
    }
    return g;
  }
  function fillSky(c, z, W, H) { c.save(); c.scale(1, H); c.fillStyle = skyGrad(c, z); c.fillRect(0, 0, W, 1); c.restore(); }
  function starTile() {
    if (C.img.stars !== undefined) return C.img.stars;
    const cv = canvas(512, 512); if (!cv) return (C.img.stars = null);
    const g = cv.getContext("2d"), r = U.rng(4242);
    for (let i = 0; i < 120; i++) {
      const x = r() * 512, y = r() * 512, s = r() < 0.86 ? 0.5 + r() * 1.0 : 1.5 + r() * 1.1;
      g.fillStyle = "rgba(255,246,222," + (0.3 + r() * 0.7).toFixed(2) + ")";
      g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill();
    }
    return (C.img.stars = cv);
  }
  function stars(c, W, H, alt, t, a) {
    if (a < 0.02) return;
    const tile = starTile();
    c.save();
    if (tile) {
      if (!C.pat.stars) C.pat.stars = c.createPattern(tile, "repeat");
      c.fillStyle = C.pat.stars;
      for (let l = 0; l < 2; l++) {
        const sc = l ? 1 : 0.62, oy = (alt * GAP * (l ? 0.05 : 0.02)) % (512 * sc), ox = l ? 173 : 0;
        c.globalAlpha = a * (l ? 1 : 0.7);
        c.save(); c.translate(ox, oy); c.scale(sc, sc);
        c.fillRect(-ox / sc - 2, -oy / sc - 2, W / sc + 4, H / sc + 4); c.restore();
      }
    }
    // twinkly big stars
    const per = H + 80;
    for (let i = 0; i < 14; i++) {
      const x = hr(i, 1) * W, y = ((hr(i, 2) * per + alt * GAP * 0.04) % per) - 40;
      const tw = 0.5 + 0.5 * Math.sin(t * (1.2 + hr(i, 3) * 2) + i * 1.7);
      c.globalAlpha = a * (0.4 + 0.6 * tw);
      spark(c, x, y, 2.5 + tw * 4 * (0.5 + hr(i, 4)), "#fff6de");
    }
    // some of the stars are eyes. they blink. they are watching Gerald.
    if (a > 0.45) {
      c.globalAlpha = (a - 0.45) * 1.6; c.strokeStyle = "rgba(255,246,222,0.9)"; c.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        const x = (0.08 + hr(i, 31) * 0.84) * W, y = ((hr(i, 32) * per + alt * GAP * 0.05) % per) - 40;
        if (Math.abs(x - W / 2) < 150) continue;
        const b = blink(i * 11 + 3, t * 0.7), lk = look(x, y, i * 5, t);
        for (let e = -1; e <= 1; e += 2) {
          const ex = x + e * 6;
          if (b > 0.5) { ln(c, ex - 3, y, ex + 3, y); continue; }
          ov(c, ex, y, 3.4, 3.4, "#fff6de", false);
          ov(c, ex + lk.x * 1.6, y + lk.y * 1.6, 1.6, 1.6, "#1d0f2b", false);
        }
      }
    }
    c.restore();
  }
  /* the Moon, far away, watching Gerald the whole way up (zones 0-5) */
  function moonFallback(c, r, t, lk, mood) {
    c.strokeStyle = INK.C.ink; c.lineWidth = Math.max(2, r * 0.05);
    bl(c, 0, 0, r, r, "#f4ecd0", 51, 0.025);
    ov(c, -r * 0.42, -r * 0.35, r * 0.17, r * 0.13, "#ddd2b0", false);
    ov(c, r * 0.45, r * 0.42, r * 0.22, r * 0.16, "#ddd2b0", false);
    ov(c, r * 0.5, -r * 0.5, r * 0.1, r * 0.08, "#ddd2b0", false);
    const er = r * 0.16;
    for (let e = -1; e <= 1; e += 2) {
      const ex = e * r * 0.33, ey = -r * 0.05;
      ov(c, ex, ey, er, er, "#fff", true);
      ov(c, ex + lk.x * er * 0.45, ey + lk.y * er * 0.45, er * 0.5, er * 0.5, INK.C.ink, false);
      if (mood !== "nervous") { c.beginPath(); c.ellipse(ex, ey, er, er, 0, PI, TAU); c.closePath(); fs(c, "#e6dcb8"); }
    }
    c.beginPath();
    if (mood === "nervous") { c.moveTo(-r * 0.2, r * 0.38); c.lineTo(-r * 0.07, r * 0.33); c.lineTo(r * 0.07, r * 0.4); c.lineTo(r * 0.2, r * 0.34); }
    else { c.moveTo(-r * 0.2, r * 0.35); c.quadraticCurveTo(r * 0.05, r * 0.45, r * 0.24, r * 0.28); }
    c.stroke();
  }

    c.restore();
  }
  D.hands = {
    pal: procPal([25, 0, 200]),
    k: [[3, 3, 1], [0, 1, 2], [0, 1, 2]],
    item(c, kind, x, y, s, sd, t, P) {
      y += Math.sin(t * 0.4 + sd) * 4;
      if (kind === 0 || kind === 3) { hand(c, x, y, s * (kind === 3 ? 0.9 : 1.4), Math.sin(t * 3 + sd) * 0.35, 0, P); return; }
      if (kind === 1) { hand(c, x, y, s * 1.4, Math.sin(t * 0.8 + sd) * 0.08, 1, P); return; }
      hand(c, x, y, s * 1.4, Math.sin(t * 0.6 + sd) * 0.12, 2, P);
    },
  };
  /* ---- jellies: wobbling jelly moulds with faces, jellyfish, gummy bears ---- */
  D.jellies = {
    pal: procPal([0, 60, 300]),
    k: [[3, 3, 1], [0, 1, 2], [0, 1, 2]],
    item(c, kind, x, y, s, sd, t, P) {
      y += Math.sin(t * 0.5 + sd) * 5;
      const ga = c.globalAlpha, wb = Math.sin(t * 5 + sd) * 0.07;
      if (kind === 0) {
        ov(c, x, y + 14 * s, 34 * s, 6 * s, P.w, true);
        c.save(); c.translate(x, y + 12 * s); c.scale(1 + wb, 1 - wb);
        c.globalAlpha = ga * 0.85; rr(c, -24 * s, -40 * s, 48 * s, 40 * s, 16 * s); fs(c, P[0]); c.globalAlpha = ga;
        for (let i = -1; i <= 1; i++) { c.beginPath(); c.moveTo(i * 12 * s, -38 * s); c.quadraticCurveTo(i * 15 * s, -20 * s, i * 12 * s, -2 * s); c.stroke(); }
        ov(c, -14 * s, -30 * s, 4 * s, 7 * s, P.w, false);
        face(c, 0, -18 * s, 26 * s, P, sd, t, 4);
        c.restore(); return;
      }
      if (kind === 1) {                      // jellyfish
        const lw = c.lineWidth; c.lineWidth = lw * 0.8;
        for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(x + i * 7 * s, y); for (let k = 1; k <= 5; k++) c.lineTo(x + i * 7 * s + Math.sin(t * 2 + k + i + sd) * 4 * s, y + k * 9 * s); c.stroke(); }
        c.lineWidth = lw;
        c.globalAlpha = ga * 0.85;
        c.beginPath(); c.arc(x, y, 24 * s * (1 + wb), PI, TAU);
        for (let i = 0; i < 4; i++) c.quadraticCurveTo(x + (18 - i * 12) * s, y + 7 * s, x + (12 - i * 12) * s, y);
        c.closePath(); fs(c, P[1]); c.globalAlpha = ga;
        face(c, x, y - 9 * s, 22 * s, P, sd, t, 0); return;
      }
      c.globalAlpha = ga * 0.85;           // gummy bear (or the far little blobs)
      const k = kind === 3 ? 0.7 : 1, col = P[sd % 3];
      ov(c, x - 9 * k * s, y + 24 * k * s, 7 * k * s, 6 * k * s, col, true); ov(c, x + 9 * k * s, y + 24 * k * s, 7 * k * s, 6 * k * s, col, true);
      ov(c, x, y + 10 * k * s, 15 * k * s, 16 * k * s, col, true);
      ov(c, x - 9 * k * s, y - 14 * k * s, 5 * k * s, 5 * k * s, col, true); ov(c, x + 9 * k * s, y - 14 * k * s, 5 * k * s, 5 * k * s, col, true);
      ov(c, x, y - 5 * k * s, 12 * k * s, 11 * k * s, col, true);
      c.globalAlpha = ga;
      ov(c, x - 4 * k * s, y - 6 * k * s, 1.6 * k * s, 1.6 * k * s, P.k, false); ov(c, x + 4 * k * s, y - 6 * k * s, 1.6 * k * s, 1.6 * k * s, P.k, false);
    },
  };
  /* ---- keys: skeleton keys, keyholes with something looking through, jingly keyrings ---- */
  function key(c, x, y, s, rot, P) {
    c.save(); c.translate(x, y); c.rotate(rot);
    rr(c, 8 * s, -3 * s, 44 * s, 6 * s, 2 * s); fs(c, P[5]);
    rr(c, 40 * s, 2 * s, 5 * s, 9 * s, 1); fs(c, P[5]); rr(c, 47 * s, 2 * s, 5 * s, 6 * s, 1); fs(c, P[5]);
    ov(c, 0, 0, 13 * s, 13 * s, P[5], true); ov(c, 0, 0, 5.5 * s, 5.5 * s, P.fog, true);
    c.restore();
  }
  D.keys = {
    pal: procPal([0, 200, 30]),
    k: [[3, 3, 1], [0, 1, 2], [0, 1, 2]],
    item(c, kind, x, y, s, sd, t, P) {
      y += Math.sin(t * 0.45 + sd) * 4;
      if (kind === 0 || kind === 3) { key(c, x - 20 * s, y, s * (kind === 3 ? 0.8 : 1.2), t * 0.25 * (sd % 2 ? 1 : -1) + sd, P); return; }
      if (kind === 1) {                      // keyhole. something on the other side is looking at the stalk.
        rr(c, x - 22 * s, y - 34 * s, 44 * s, 68 * s, 6 * s); fs(c, P[1]);
        ov(c, x - 15 * s, y - 27 * s, 2 * s, 2 * s, P.k, false); ov(c, x + 15 * s, y + 27 * s, 2 * s, 2 * s, P.k, false);
        c.beginPath(); c.arc(x, y - 8 * s, 11 * s, 0.75 * PI, 2.25 * PI); c.lineTo(x + 7 * s, y + 20 * s); c.lineTo(x - 7 * s, y + 20 * s); c.closePath(); fs(c, P.k);
        if (blink(sd, t) < 0.5) { const lk = look(x, y, sd, t); ov(c, x, y - 8 * s, 6 * s, 6 * s, P.w, false); ov(c, x + lk.x * 2.5 * s, y - 8 * s + lk.y * 2.5 * s, 3 * s, 3 * s, P.k, false); }
        return;
      }
      const sw = Math.sin(t * 1.5 + sd) * 0.25;
      c.lineWidth *= 1.3; ov(c, x, y, 14 * s, 14 * s, null, true); c.lineWidth /= 1.3;
      for (let i = -1; i <= 1; i++) key(c, x + Math.sin(i * 0.6 + sw) * 12 * s, y + Math.cos(i * 0.6 + sw) * 12 * s, s * 0.75, PI / 2 + i * 0.6 + sw, P);
    },
  };
  /* ---- teacups: cups with faces, a teapot pouring into nothing, nervous sugar cubes ---- */
  function cup(c, x, y, s, P, sd, t, fc) {
    const lw = c.lineWidth;
    for (let i = 0; i < 2; i++) { const p = (t * 0.4 + i / 2 + hr(sd, i)) % 1; c.beginPath(); c.moveTo(x - 5 * s + i * 10 * s, y - 14 * s - p * 16 * s); c.quadraticCurveTo(x + i * 10 * s, y - 20 * s - p * 16 * s, x - 5 * s + i * 10 * s, y - 26 * s - p * 16 * s); c.stroke(); }
    ov(c, x, y + 14 * s, 30 * s, 6 * s, P[1], true);
    c.beginPath(); c.arc(x + 20 * s, y, 7 * s, -PI / 2, PI / 2); c.lineWidth = lw * 1.8; c.stroke(); c.lineWidth = lw;
    c.beginPath(); c.moveTo(x - 20 * s, y - 10 * s); c.lineTo(x + 20 * s, y - 10 * s); c.quadraticCurveTo(x + 19 * s, y + 13 * s, x, y + 13 * s); c.quadraticCurveTo(x - 19 * s, y + 13 * s, x - 20 * s, y - 10 * s); fs(c, P[0]);
    ov(c, x, y - 10 * s, 20 * s, 4 * s, P[8], true);
    if (fc) face(c, x, y + 1 * s, 18 * s, P, sd, t, 3);
  }
  D.teacups = {
    pal: procPal([0, 160, 40]),
    k: [[3, 3, 2], [0, 1, 2], [0, 1, 2]],
    item(c, kind, x, y, s, sd, t, P) {
      y += Math.sin(t * 0.4 + sd) * 4;
      if (kind === 0 || kind === 3) { cup(c, x, y, s * (kind === 3 ? 0.9 : 1.3), P, sd, t, kind === 0); return; }
      if (kind === 1) {                      // teapot, pouring into nothing, very carefully
        const lw = c.lineWidth; c.strokeStyle = P[8]; c.lineWidth = lw * 1.6;
        c.beginPath(); c.moveTo(x + 36 * s, y - 6 * s); c.quadraticCurveTo(x + 48 * s, y + 10 * s, x + 46 * s, y + 60 * s); c.stroke();
        c.strokeStyle = P.i; c.lineWidth = lw;
        c.save(); c.translate(x, y); c.rotate(0.35);
        c.beginPath(); c.moveTo(18 * s, 0); c.quadraticCurveTo(32 * s, -4 * s, 38 * s, -18 * s); c.lineTo(32 * s, -20 * s); c.quadraticCurveTo(26 * s, -10 * s, 14 * s, -10 * s); c.closePath(); fs(c, P[2]);
        c.beginPath(); c.arc(-24 * s, -2 * s, 10 * s, 0.5 * PI, 1.5 * PI); c.lineWidth = lw * 1.8; c.stroke(); c.lineWidth = lw;
        bl(c, 0, 0, 26 * s, 20 * s, P[2], sd, 0.04);
        ov(c, 0, -20 * s, 12 * s, 4 * s, P[1], true); ov(c, 0, -26 * s, 3.5 * s, 3.5 * s, P[1], true);
        face(c, -2 * s, 0, 20 * s, P, sd, t, 0);
        c.restore(); return;
      }
      c.save(); c.translate(x, y); c.rotate(Math.sin(t * 0.7 + sd) * 0.2);   // sugar cube. it knows.
      rr(c, -15 * s, -15 * s, 30 * s, 30 * s, 4 * s); fs(c, P[3]);
      face(c, 0, -2 * s, 20 * s, P, sd, t, 4);
      c.restore();
      spark(c, x + 18 * s, y - 18 * s, (3 + 2 * Math.sin(t * 3 + sd)) * s, P[5]);
    },
  };
  /* every procedural layer gets one GIANT, faint, very slow version of its signature object far away
     (a huge eye that watches the stalk, a door the size of a building, a clock with hands like rivers) */
  function giant(c, z, W, H, alt, t, a, name) {
    const P = PAL(name, z, 0), s = Math.min(W, H) / 150, x = W * (z.k % 2 ? 0.8 : 0.2);
    const y = H * 0.32 + (alt - z.at) * GAP * 0.03;
    if (y > H + s * 80) return;
    c.globalAlpha = a * 0.3; c.lineWidth = 2.5 * s * 0.45; c.strokeStyle = P.i;
    D[name].item(c, 0, x, y, s, 4242 + z.k * 2, t * 0.6, P, 0, W, H);
  }
  for (const n of DATA.PROC.decor) if (D[n] && !D[n].bg) D[n].bg = (c, z, W, H, alt, t, a) => giant(c, z, W, H, alt, t, a, n);
  /* =================== API =================== */
  return {
    sky, ground, landmarks, overlay,
    sets: Object.keys(D),                    // every decor set name (story + procedural)
    hasSet: n => !!D[n],
    /* drop cached gradients/patterns/palettes (e.g. after a canvas context is recreated) */
    reset() { C.sky.clear(); C.pal.clear(); C.fog.clear(); C.str.clear(); C.pat = {}; C.grad = {}; },
  };
})();

<script>/* js/state.js */
/* Gerald Wants Up — save state: shape, load/save, export/import, redenomination. */
const STATE = {
  KEY: "gwu3",
  fresh() {
    return {
      v: 3, sd: (Math.random() * 1e9) | 0, u: 0,
      // this run (reset by composting)
      m: 0, run: 0, n: 1, lv: {}, bk: {}, ac: {}, shop: {}, runT: 0,
      // permanent
      soc: 0, mu: 0, tm: 0, perk: {}, mtn: 0, strata: [], cc: 0, zone: 0, rec: 1, lastMulch: 0,
      caps: {},   // per plant slot: how many composts it has survived (level cap = 10 + 5 each)
      ua: {}, uo: {}, pa: {}, co: {}, sbOff: 0, mx: 0,   // uo / co: auto-upgrade / auto-collect switched off per slot
      relics: {}, trinkets: [], hats: { none: 1 }, hat: "none",
      quests: [], qDone: 0, qSeq: 0,
      stats: { earnL: -1, beans: 0, golden: 0, socks: 0, bubbles: 0, upgrades: 0, sprouts: 0, visitors: 0,
        pokes: 0, composts: 0, time: 0, quests: 0 },
      flags: { intro: 0, tut: 0, tutStep: 0, moonGone: 0, finale: 0, hints: {} },
      settings: { sfx: 0.7, mus: 0.4, shake: true, chatter: true, sci: false, cine: "all", music: true },
      last: Date.now(),
    };
  },
  load() {
    let S = STATE.fresh();
    try {
      const raw = localStorage.getItem(STATE.KEY);
      if (raw) S = STATE.merge(JSON.parse(raw));
      else if (localStorage.getItem("gwu2")) S.flags.legacy = 1;   // an old pre-weird save exists
    } catch (e) { console.warn("load failed", e); }
    return S;
  },
  merge(d) {
    const f = STATE.fresh(), S = Object.assign(f, d);
    for (const k of ["stats", "flags", "settings"]) S[k] = Object.assign(STATE.fresh()[k], d[k] || {});
    S.flags.hints = S.flags.hints || {};
    STATE.migrate(S);
    return S;
  },
  /* perks that were removed or capped lower: give the mulch back */
  migrate(S) {
    const old = { asp: [6, 1], aup: [8, 2.4], butl: [40, 1] };
    let back = 0;
    for (const id in old) {
      const L = S.perk[id] || 0;
      for (let l = 0; l < L; l++) back += Math.ceil(old[id][0] * old[id][1] ** l);
      delete S.perk[id];
    }
    const hd = ECON.PERKS.find(d => d.id === "head");
    if ((S.perk.head || 0) > hd.max) {
      for (let l = hd.max; l < S.perk.head; l++) back += Math.ceil(3 * 2.1 ** l);
      S.perk.head = hd.max;
    }
    if (back > 0) { S.mu += back; S.flags.refund = (S.flags.refund || 0) + back; }
    S.co = S.co || {};
    if (S.go) { for (const k in S.ua) S.uo[k] = 1; S.sbOff = 1; }   // old global pause -> every plant switched off
    delete S.go;
    if (S.lastN === undefined) S.lastN = S.cc ? Math.max(ECON.MIN_COMPOST, ...S.strata.map(st => st.n || 0)) : 0;
  },
  save(S) {
    S.last = Date.now();
    try { localStorage.setItem(STATE.KEY, JSON.stringify(S)); } catch (e) { /* storage full or blocked */ }
  },
  exportStr(S) { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); },
  importStr(str) {
    const d = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if (!d || typeof d !== "object" || d.v !== 3) throw new Error("not a Gerald save");
    return STATE.merge(d);
  },
  wipe() { try { localStorage.removeItem(STATE.KEY); } catch (e) {} },
  /* add x money units to the all-time earned counter (kept as log10 so it never overflows) */
  addEarned(S, x) {
    if (!(x > 0)) return;
    const b = Math.log10(x) + S.u, a = S.stats.earnL;
    S.stats.earnL = a < 0 ? b : Math.max(a, b) + Math.log10(1 + 10 ** (Math.min(a, b) - Math.max(a, b)));
  },
  /* redenominate when amounts get astronomically large (see econ.js) */
  shift(S) {
    const sh = ECON.needShift(S);
    if (!sh) return;
    const d = 10 ** sh;
    S.u += sh; S.m /= d; S.run /= d;
    for (const k in S.bk) S.bk[k] /= d;
    S.qRun = (S.qRun || 0) / d;
    for (const q of S.quests) if (q.t === "earn") { q.n /= d; q.acc = (q.acc || 0) / d; }
  },
};
